<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Vanilla Shop</title>
    <link rel="stylesheet" href="./style.css" />
    <script defer src="./main.js"></script>
  </head>
  <body>
    <header class="header">
      <h1 class="header__logo">Vanilla Shop</h1>
    </header>

    <main class="layout">
      <h2 class="layout__title">전체 상품</h2>

      <ul class="product-list">
        <li class="product-card" data-id="1">
          <div class="product-card__thumb">
            <img class="product-card__image" src="https://cdn.dummyjson.com/product-images/beauty/essence-mascara-lash-princess/thumbnail.webp" alt="Essence Mascara Lash Princess" width="300" height="300" loading="lazy" decoding="async" />
          </div>

          <p class="product-card__brand">Essence</p>
          <h3 class="product-card__name">Essence Mascara Lash Princess</h3>

          <div class="product-card__price-row">
            <strong class="product-card__price">$9.99</strong>
          </div>

          <p class="product-card__rating">
            <span class="product-card__star" aria-hidden="true">★</span>
            <span class="product-card__score">2.56</span>
            <span class="product-card__review-count">리뷰 3</span>
          </p>
        </li>
      </ul>
    </main>
  </body>
</html>
