<!doctype html>
<html lang="ko">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Vanilla Shop</title>
        <link rel="stylesheet" href="./style.css" />
        <script defer src="./main.js"></script>
    </head>
    <body>
        <header class="header">
            <h1 class="header__logo">Vanilla Shop</h1>

            <button class="cart-button" type="button" aria-label="장바구니">
                <svg
                    class="cart-button__icon"
                    viewBox="0 0 24 24"
                    width="24"
                    height="24"
                    fill="none"
                    stroke="currentColor"
                    stroke-width="1.6"
                    stroke-linecap="round"
                    stroke-linejoin="round"
                    aria-hidden="true"
                >
                    <path d="M2.5 3.5h2.3l2.4 11.4h10.9l1.9-8.2H6.2" />
                    <circle cx="9.2" cy="19.4" r="1.3" />
                    <circle cx="17.6" cy="19.4" r="1.3" />
                </svg>
                <span class="cart-button__count">0</span>
            </button>
        </header>

        <main class="layout">
            <h2 class="layout__title">전체 상품</h2>

            <ul class="product-list"></ul>
        </main>
    </body>
</html>
